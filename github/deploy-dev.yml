name: Deploy NestJS to Amazon EC2

on:
  push:
    branches:
      - dev

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Build & Test (runs on GitHub runner)
  # ─────────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn' # ← yarn cache instead of npm

      - name: Install Dependencies
        run: yarn install --frozen-lockfile
        # --frozen-lockfile → yarn equivalent of npm ci
        # Fails if yarn.lock is out of sync — keeps builds deterministic

      - name: Run Linter
        run: yarn lint

      - name: Run Unit Tests
        run: yarn test --passWithNoTests

      - name: Build NestJS App
        run: yarn build

  # ─────────────────────────────────────────
  # JOB 2: Deploy (only runs if build passes)
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 30m

          script: |
            set -e

            echo "========================================"
            echo "  Starting NestJS Deployment - $(date)"
            echo "========================================"

            # ── 1. Navigate to project directory ──
            cd ${{ secrets.TARGET_DIR }}

            # ── 2. Sync with GitHub (force match) ──
            echo "[1/6] Syncing code from GitHub..."
            git fetch --all
            git reset --hard origin/dev
            git clean -fd

            # ── 3. Install dependencies via Yarn ──
            # --frozen-lockfile  → never auto-update yarn.lock on server
            # --production       → skips devDependencies (runtime only)
            # ⚠️  See note below if your build fails due to missing devDeps
            echo "[2/6] Installing dependencies..."
            rm -rf node_modules
            yarn install --frozen-lockfile --production

            # ── 4. Build NestJS application ──
            echo "[3/6] Building application..."
            rm -rf dist
            yarn build

            # ── 5. Environment check ──
            echo "[4/6] Environment: Using .env from server filesystem"

            # ── 6. Zero-downtime reload via PM2 ──
            echo "[5/6] Reloading PM2 process..."
            pm2 reload ${{ secrets.PM2_APP_NAME }} \
              || pm2 start dist/main.js \
                    --name ${{ secrets.PM2_APP_NAME }} \
                    --env production \
                    -i max

            # ── 7. Persist PM2 process list ──
            echo "[6/6] Saving PM2 state..."
            pm2 save

            echo "========================================"
            echo "  Deployment Complete - $(date)"
            echo "========================================"
            pm2 show ${{ secrets.PM2_APP_NAME }}
